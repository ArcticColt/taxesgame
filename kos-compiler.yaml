compilers:
  - description: KallistiOS SH-4 C++
    match-compiler-exe: "(.*/)?sh-elf-g\\+\\+"
    match-language: CPP
    include-dirs:
      - /opt/toolchains/dc/kos/include
      - /opt/toolchains/dc/kos/kernel/arch/dreamcast/include
      - /opt/toolchains/dc/kos/addons/include
      - /opt/toolchains/dc/kos-ports/include

  - description: KallistiOS SH-4 C
    match-compiler-exe: "(.*/)?sh-elf-gcc"
    match-language: C
    include-dirs:
      - /opt/toolchains/dc/kos/include
      - /opt/toolchains/dc/kos/kernel/arch/dreamcast/include
      - /opt/toolchains/dc/kos/addons/include
      - /opt/toolchains/dc/kos-ports/include
